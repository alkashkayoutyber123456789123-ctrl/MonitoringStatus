; =============================================================================
; AstroWrist Dosimeter & Biometric Monitor — PlatformIO Configuration
; Target Hardware: ESP32-WROOM-32D (esp32dev)
; Sensors: J305 Geiger-Mueller Tube, MAX30102 PPG Sensor, BMP280 Barometer
; Display: SSD1306 128x64 I2C OLED
; =============================================================================

[platformio]
default_envs = esp32dev
name = AstroWrist-Dosimeter-Biometric-Monitor
description = Wearable Astronaut Radiation Dosimeter & Biometric Monitor (NASA STD-3001 & DONKI Integrated)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial UART Telemetry & NASA DONKI Uplink Speed
monitor_speed = 115200
upload_speed = 921600
monitor_filters =
    esp32_exception_decoder
    time

; Compiler flags for strict type safety and IRAM interrupt performance
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wall
    -Wextra
    -Wno-unused-parameter

; External Hardware Libraries
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
    bblanchon/ArduinoJson @ ^7.0.4
